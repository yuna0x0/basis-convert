name: Release

# Tag a commit with the version in package.json, prefixed with v, and push the tag.
# The listing at vpm.yuna0x0.com reads releases from this repository, and expects each one to
# carry the bare package.json and a zip of the package named <package id>-<version>.zip.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_PATH: Packages/com.yuna0x0.basis.convert

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the package
        id: package
        run: |
          name=$(jq -r .name "$PACKAGE_PATH/package.json")
          version=$(jq -r .version "$PACKAGE_PATH/package.json")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="${{ steps.package.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version." >&2
            exit 1
          fi

      # Tests are not shipped. Modular Avatar, NDMF and Avatar Optimizer all keep theirs in a
      # folder Unity ignores, so a consumer never compiles them; ours stay in the repository
      # where the dev loop can run them, and are left out of the artifacts instead.
      - name: Build the zip
        run: |
          cd "$PACKAGE_PATH"
          zip -r "$GITHUB_WORKSPACE/${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip" .             -x '*.DS_Store' 'Tests/*' 'Tests.meta'

      - name: List the files for the unitypackage
        run: |
          find "$PACKAGE_PATH" -type f ! -name '*.meta' ! -path "$PACKAGE_PATH/Tests/*" -print             > unitypackage-files.txt

      - name: Build the unitypackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.unitypackage
          include-files: unitypackage-files.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            ${{ env.PACKAGE_PATH }}/package.json
            ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip
            ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.unitypackage
