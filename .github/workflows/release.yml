name: Release

# Tag a commit with the version in package.json, prefixed with v, and push the tag.
# The listing at vpm.yuna0x0.com reads releases from this repository, and expects each one to
# carry the bare package.json and a zip of the package named <package id>-<version>.zip.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_PATH: Packages/com.yuna0x0.basis.convert

jobs:
  release:
    runs-on: ubuntu-latest

    # The signing credentials live in this environment rather than in repository secrets, so a
    # deployment tag rule can limit them to v* tags and a reviewer can be required. A job only
    # sees an environment's secrets when it declares it, and its protection rules then gate the
    # whole job, which for a release is what you want anyway.
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Read the package
        id: package
        run: |
          name=$(jq -r .name "$PACKAGE_PATH/package.json")
          version=$(jq -r .version "$PACKAGE_PATH/package.json")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="${{ steps.package.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version." >&2
            exit 1
          fi

      # Tests are not shipped. Modular Avatar, NDMF and Avatar Optimizer all keep theirs in a
      # folder Unity ignores, so a consumer never compiles them; ours stay in the repository
      # where the dev loop can run them, and are left out of the artifacts instead.
      - name: Build the zip
        env:
          ZIP_NAME: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip
        run: |
          cd "$PACKAGE_PATH"
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.DS_Store' 'Tests/*' 'Tests.meta'

      # The action packs the asset each .meta file belongs to, so the list it is given is the
      # meta files rather than the assets, directories included.
      - name: List the meta files for the unitypackage
        run: |
          find "$PACKAGE_PATH" -name '*.meta' ! -path "$PACKAGE_PATH/Tests/*" ! -name 'Tests.meta' > meta-files.txt
          wc -l < meta-files.txt

      - name: Build the unitypackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.unitypackage
          include-files: meta-files.txt

      # Unity 6.3 and later check tarball packages for a signature, and OpenUPM publishes a
      # pre-signed tarball rather than signing anything itself. Unity holds the certificate; a
      # service account with the "Package Manager Package Signer" role authenticates. These
      # steps do nothing until those secrets exist, so a release works either way.
      - name: Check for signing credentials
        id: signing
        run: |
          if [ -n "${{ secrets.UPM_ORG_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign a UPM tarball
        if: steps.signing.outputs.enabled == 'true'
        env:
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh | bash
          # The installer puts the binary in ~/.upm/bin and edits ~/.bashrc, which a job step
          # does not read, so the directory goes on PATH here.
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.upm/bin:$PATH"
          command -v upm
          upm --version
          mkdir -p dist
          upm pack "$PACKAGE_PATH" --organization-id "$UPM_ORG_ID" --destination dist
          tarball=$(ls dist/*.tgz)
          if ! tar -tzf "$tarball" | grep -q 'package/.attestation.p7m'; then
            echo "The tarball carries no attestation." >&2
            exit 1
          fi

      # The notes are the changelog section for this version. GitHub's generated list of commits
      # is not what releases in this ecosystem look like, and is not written for a reader.
      - name: Take the release notes from the changelog
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          python3 - <<'PY' > release-notes.md
          import os, re
          version = os.environ["VERSION"]
          text = open(os.environ["PACKAGE_PATH"] + "/CHANGELOG.md").read()
          match = re.search(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.S | re.M)
          print(match.group(1).strip() if match else "", end="")
          PY
          if [ ! -s release-notes.md ]; then
            echo "The changelog has no section for $VERSION." >&2
            exit 1
          fi
          cat release-notes.md

      # Immutable releases are enabled on this repository, so a published release's assets and
      # its tag are locked: nothing can be attached, changed or deleted afterwards, and the tag
      # cannot be reused even if the repository is. Everything therefore has to be attached
      # before the release is published, and a release that fails halfway cannot be retried
      # under the same version.
      #
      # Staging a draft and publishing it separately is the shape GitHub documents for this.
      # Doing it explicitly, rather than relying on the action to upload before it publishes,
      # keeps the guarantee ours: the action is pinned to a floating major tag and orders those
      # two steps internally, so that ordering could change without anything here changing.
      # It also means a prerelease, which the action would otherwise leave published while it
      # uploads, needs no special case.
      - name: Stage the release as a draft
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-notes.md
          files: |
            ${{ env.PACKAGE_PATH }}/package.json
            ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip
            ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.unitypackage
            dist/*.tgz

      # Everything is attached by now, so publishing is the step that makes it immutable.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "The draft step reported no release id." >&2
            exit 1
          fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false -F make_latest=true --jq '.html_url'
