name: Documentation

# Builds the Docusaurus site in docs/ and publishes it to GitHub Pages. Pages has to be enabled
# for the repository, with GitHub Actions as the source.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Packages/com.yuna0x0.basis.convert/package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm and Node, and runs the install. The pnpm version comes from
      # packageManager and the runtime from devEngines.runtime, both in docs/package.json.
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: docs
          cache: true
          require-lockfile: true

      - run: pnpm build
        working-directory: docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
